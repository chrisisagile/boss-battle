name: PR Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route tree
        run: pnpm generate:routes

      - name: Prepare Convex generated artifacts
        run: bash ./devops/scripts/prepare-convex-ci.sh

      - name: Run PR fast validation
        run: pnpm validate:pr:fast

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: fast-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route tree
        run: pnpm generate:routes

      - name: Prepare Convex generated artifacts
        run: bash ./devops/scripts/prepare-convex-ci.sh

      - name: Install Playwright browser for Aspire E2E
        run: pnpm test:e2e:install

      - name: Run Aspire-backed E2E
        run: pnpm validate:pr:e2e
