name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: read
steps:
  - id: agent1
    type: agent
    prompt: Find any file that contains the phrase '${{ inputs.title }}' and create a list of the file and description of what they do. Save that as a markdown file in the docs directory.
    model: anthropic/claude-sonnet-5
    harness: claude
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
