name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: read
steps:
  - id: agent1
    type: agent
    prompt: Use the GitHub CLI to create a new issue in the configured repository with ${{ inputs.title }} as the issue title and ${{ inputs.description }} as the issue body.
    model: openai/gpt-5.5
    harness: opencode
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
