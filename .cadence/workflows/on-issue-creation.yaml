name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: read
steps:
  - id: agent1
    type: agent
    prompt: Read ${{ inputs.title }} and ${{ inputs.description }} and create an email notifying our boss of the issue. Add the email to an appropriate folder in our project.
    model: anthropic/claude-sonnet-5
    harness: claude
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
