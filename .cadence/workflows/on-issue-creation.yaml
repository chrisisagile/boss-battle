name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: read
steps:
  - id: agent1
    type: agent
    prompt: |-
      Issue Title: ${{ inputs.title }} 
      Issue Description: ${{ inputs.description }} 

      create a new issue in the github repo with the title and description and a random sonnet in the description.
    model: anthropic/claude-sonnet-5
    harness: claude
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
