name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: write
steps:
  - id: agent1
    type: agent
    prompt: Use the grill-me skill to plan a new feature titled ${{ inputs.title }} based on ${{ inputs.description }}
    model: openai/gpt-5.5
    skills:
      - grilling
      - grill-me
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
  - id: push1
    type: git-write
    source: chrisisagile-boss-battle
    message: "feat: create file directory based on  ${{ inputs.title }}"
  - id: pr1
    type: pull-request
    source: chrisisagile-boss-battle
    title: "feat: Research stuff"
