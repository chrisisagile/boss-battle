name: on-issue-creation
inputs:
  title: {}
  description: {}
code:
  - source: chrisisagile-boss-battle
    mode: write
steps:
  - id: agent1
    type: agent
    prompt: Find any file that contains the phrase '${{ inputs.title }}' and create a list of the file and description of what they do. Save that as a markdown file in the docs directory.
    model: anthropic/claude-sonnet-5
    harness: claude
    integrations:
      - provider: github
        source: chrisisagile-boss-battle
        permissions:
          issues: write
  - id: push1
    type: git-write
    source: chrisisagile-boss-battle
    message: "feat: create file directory based on  ${{ inputs.title }}"
  - id: pr1
    type: pull-request
    source: chrisisagile-boss-battle
    title: "feat: Research stuff"
